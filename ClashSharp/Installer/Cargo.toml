[package]
name = "clashsharp-installer"
version = "1.0.0"
edition = "2024"
description = "Clash# Native Windows Installer"

[[bin]]
name = "ClashSharp-Installer"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "std",
    "system-tray",
] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint-build = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
